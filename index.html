<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Banter Hub - 7 Posts Daily</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}
header{background:linear-gradient(90deg,#00ff88,#0088ff);padding:16px;text-align:center;position:sticky;top:0}
header h1{color:#000;font-size:22px;font-weight:900}
header p{color:#000;font-size:11px;font-weight:700}
.container{max-width:500px;margin:auto;padding:10px}
.post{background:#1e1e1e;border-radius:16px;margin:14px 0;border:1px solid #333;overflow:hidden}
.head{padding:12px;display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;background:linear-gradient(135deg,#00ff88,#0088ff);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900}
.tag{font-size:9px;padding:4px 8px;border-radius:20px;font-weight:800;margin-left:auto}
.t-news{background:#0088ff}.t-banter{background:#ff0080}.t-stats{background:#00ff88;color:#000}
.img{height:180px;background:#222;display:flex;align-items:center;justify-content:center;font-size:60px}
.txt{padding:12px}
.txt h2{font-size:17px;line-height:1.3}
.foot{padding:10px 12px;border-top:1px solid #333;display:flex;justify-content:space-between;color:#777;font-size:12px}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#00ff88,#0088ff);border:none;border-radius:12px;font-weight:900;color:#000}
.live{position:fixed;bottom:15px;right:15px;background:red;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:900}
</style>
</head>
<body>
<header>
<h1>⚽ FOOTBALL BANTER HUB</h1>
<p>60% NEWS • 30% BANTER • 10% STATS • 7 POSTS DAILY</p>
</header>
<div class="container">
<div id="feed"></div>
<button class="btn" onclick="load()">🔄 REFRESH FEED</button>
<div style="text-align:center;padding:15px;color:#555;font-size:11px">BOT ACTIVE: 7am,10am,1pm,4pm,7pm,9pm,11pm Yaounde Time<br>Next: Auto to Facebook</div>
</div>
<div class="live">● LIVE</div>
<script>
const data=[
{ty:"news",tg:"NEWS",tt:"Arsenal bottle it again? Gunners drop points 😭",em:"😱",tm:"8m",lk:"2.4K",cm:"890"},
{ty:"banter",tg:"BANTER",tt:"Man Utd fans after 1 win: 'We're back' 🤣 Where were you?",em:"🤣",tm:"1h",lk:"5.1K",cm:"1.2K"},
{ty:"stats",tg:"STATS",tt:"Haaland 8 goals in 6 games. Best striker? Yes/No?",em:"📊",tm:"2h",lk:"3.3K",cm:"650"},
{ty:"news",tg:"TRANSFER",tt:"Mbappe to Real Madrid BOMBSHELL - Good or flop?",em:"👀",tm:"3h",lk:"4.8K",cm:"2.1K"},
{ty:"banter",tg:"BANTER",tt:"FT: Barca 3-1 Madrid 🔵🔴 Madrid fans explain 👇",em:"🔥",tm:"4h",lk:"9.2K",cm:"3.4K"}
];
function load(){let f=document.getElementById('feed');f.innerHTML='';data.forEach(p=>{f.innerHTML+=`<div class="post"><div class="head"><div class="av">FB</div><div><b style="font-size:13px">Football Banter Hub</b><div style="font-size:10px;color:#888">${p.tm} ago</div></div><div class="tag t-${p.ty}">${p.tg}</div></div><div class="img">${p.em}</div><div class="txt"><h2>${p.tt}</h2><div style="color:#888;font-size:12px;margin-top:6px">Auto posted to FB • #Football #Banter</div></div><div class="foot"><span>❤️ ${p.lk}</span><span>💬 ${p.cm}</span><span>↗️ Share</span></div></div>`})}
load();
</script>
</body>
</html>
