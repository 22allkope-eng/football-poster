<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial, sans-serif}
.poster{width:360px;background:linear-gradient(180deg,#111 0%,#1a2a4a 50%,#0f172a 100%);border-radius:20px;overflow:hidden;border:2px solid #facc15;color:white;text-align:center;padding:25px;box-shadow:0 20px 60px rgba(0,0,0,0.8)}
.top{color:#facc15;letter-spacing:4px;font-size:12px;font-weight:bold}
h1{font-size:32px;margin:15px 0 5px}
.vs{display:flex;justify-content:space-between;align-items:center;margin:25px 0}
.team{width:110px}
.circle{width:90px;height:90px;background:linear-gradient(135deg,#facc15,#f97316);border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:black}
.vs-text{font-size:40px;font-weight:900;color:#facc15;font-style:italic}
.team-name{font-weight:bold;font-size:18px}
.info{background:rgba(255,255,255,0.08);border-radius:12px;padding:15px;margin:20px 0}
.btn{background:#facc15;color:black;padding:12px 25px;border-radius:30px;font-weight:bold;display:inline-block;margin-top:10px}
</style>
</head>
<body>
<div class="poster">
<div class="top">⚽ PREMIER LEAGUE • LIVE MATCH</div>
<h1>MATCH DAY</h1>
<div class="vs">
<div class="team"><div class="circle">A</div><div class="team-name">TEAM A</div></div>
<div class="vs-text">VS</div>
<div class="team"><div class="circle" style="background:linear-gradient(135deg,#38bdf8,#3b82f6)">B</div><div class="team-name">TEAM B</div></div>
</div>
<div class="info">
<div>📅 SUNDAY, SEPT 22 • 8:00 PM</div>
<div style="margin-top:8px">🏟️ Olembe Stadium, Yaoundé</div>
</div>
<div class="btn">GET TICKETS NOW</div>
<div style="margin-top:20px;font-size:11px;opacity:0.6">www.22allkope-eng.com • AllKopE</div>
</div>
</body>
</html>
